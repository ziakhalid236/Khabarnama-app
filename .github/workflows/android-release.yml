name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Debug APK, Release APK & Play Store AAB
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'khabarnama2026' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'khabarnama2026' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK Licenses & Install API 36 & 36.1
        run: |
          echo "y" | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          if [ ! -d "${ANDROID_HOME}/platforms/android-36.1" ] && [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "Creating android-36.1 platform fallback from android-36..."
            cp -r "${ANDROID_HOME}/platforms/android-36" "${ANDROID_HOME}/platforms/android-36.1"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=36.1/g' "${ANDROID_HOME}/platforms/android-36.1/source.properties" || true
          fi
          echo "y" | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Ensure .env File Exists for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Upload Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          rm -f my-upload-key.jks
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Using production upload keystore from GitHub Secrets..."
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Generating self-contained release upload keystore (alias: upload)..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass khabarnama2026 \
              -alias upload \
              -keypass khabarnama2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Khabarnama,OU=Mobile,O=Khabarnama,L=Karachi,ST=Sindh,C=PK"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -Pkotlin.compiler.execution.strategy=daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Signed Release APK & Play Store AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Pkotlin.compiler.execution.strategy=daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Upload Signed Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Khabarnama-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Play Store Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Khabarnama-PlayStore-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Khabarnama-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
